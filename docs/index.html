<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢乐星会数据刷新</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    text-align: center;
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 20px; color: #1f2329; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #8f959e; margin-bottom: 24px; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: #3370ff;
    color: #fff;
  }
  .btn:hover { background: #2860e0; }
  .btn:disabled { background: #c9cdd4; cursor: not-allowed; }
  .btn.loading { background: #c9cdd4; }
  .result {
    margin-top: 20px;
    text-align: left;
    display: none;
  }
  .result.show { display: block; }
  .result-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0f1f2;
    font-size: 14px;
  }
  .result-item:last-child { border-bottom: none; }
  .result-label { color: #8f959e; }
  .result-value { color: #1f2329; font-weight: 500; }
  .result-value.success { color: #00b42a; }
  .result-value.error { color: #f53f3f; }
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg {
    margin-top: 12px;
    font-size: 13px;
    color: #8f959e;
    min-height: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎬</div>
  <h1>欢乐星会数据刷新</h1>
  <p class="subtitle">点击按钮同步最新影票和兑换券数据</p>
  <button class="btn" id="refreshBtn" onclick="refresh()">🔄 手动刷新数据</button>
  <div class="status-msg" id="statusMsg"></div>
  <div class="result" id="result">
    <div class="result-item">
      <span class="result-label">状态</span>
      <span class="result-value" id="resStatus">-</span>
    </div>
    <div class="result-item">
      <span class="result-label">数据日期</span>
      <span class="result-value" id="resDate">-</span>
    </div>
    <div class="result-item">
      <span class="result-label">影票抓取</span>
      <span class="result-value" id="resTicket">-</span>
    </div>
    <div class="result-item">
      <span class="result-label">兑换券抓取</span>
      <span class="result-value" id="resCoupon">-</span>
    </div>
    <div class="result-item">
      <span class="result-label">汇总更新</span>
      <span class="result-value" id="resSummary">-</span>
    </div>
    <div class="result-item">
      <span class="result-label">耗时</span>
      <span class="result-value" id="resDuration">-</span>
    </div>
  </div>
</div>
<script>
const API_URL = "https://hlxh-daily-sync-hrtgqcnwxb.cn-hangzhou.fcapp.run";

async function refresh() {
  const btn = document.getElementById('refreshBtn');
  const statusMsg = document.getElementById('statusMsg');
  const result = document.getElementById('result');
  
  btn.disabled = true;
  btn.classList.add('loading');
  btn.innerHTML = '<span class="spinner"></span>正在刷新...';
  statusMsg.textContent = '正在登录并抓取数据，请稍候...';
  result.classList.remove('show');
  
  const startTime = Date.now();
  
  try {
    const response = await fetch(API_URL, { method: 'GET' });
    const data = await response.json();
    
    if (data.success) {
      document.getElementById('resStatus').textContent = '✅ 成功';
      document.getElementById('resStatus').className = 'result-value success';
      document.getElementById('resDate').textContent = data.data.date || '-';
      document.getElementById('resTicket').textContent = data.data.ticket_fetched + ' 条';
      document.getElementById('resCoupon').textContent = data.data.coupon_fetched + ' 条';
      document.getElementById('resSummary').textContent = data.data.summary_updated + ' 条';
      document.getElementById('resDuration').textContent = data.data.duration_seconds + ' 秒';
      statusMsg.textContent = '数据刷新完成！';
    } else {
      throw new Error(data.error || '未知错误');
    }
  } catch (err) {
    document.getElementById('resStatus').textContent = '❌ 失败';
    document.getElementById('resStatus').className = 'result-value error';
    statusMsg.textContent = '刷新失败：' + err.message;
  } finally {
    result.classList.add('show');
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.innerHTML = '🔄 再次刷新';
  }
}
</script>
</body>
</html>
